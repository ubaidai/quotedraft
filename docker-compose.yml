services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quotedraft
      POSTGRES_PASSWORD: quotedraft
      POSTGRES_DB: quotedraft
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedraft"]
      interval: 5s
      retries: 10

  odoo-db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes: [odoodb:/var/lib/postgresql/data]

  odoo:
    image: odoo:17
    depends_on: [odoo-db]
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports: ["8069:8069"]
    volumes: [odoodata:/var/lib/odoo]

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      QD_STORE: postgres
      DATABASE_URL: postgresql://quotedraft:quotedraft@db:5432/quotedraft
      ODOO_URL: http://odoo:8069
    ports: ["8000:8000"]
    command: sh -c "python scripts/load_catalog.py && uvicorn quotedraft.api:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  odoodb:
  odoodata:
